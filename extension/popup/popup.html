<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Control-X</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <span class="brand">Control-X</span>
      <label class="master" title="Turn Control-X on or off">
        <span id="master-label">On</span>
        <input type="checkbox" class="switch" id="enabled" />
      </label>
    </header>

    <p class="muted">Cut out the junk</p>
    <p id="status" class="status muted">…</p>
    <p id="ai-error" class="error" hidden></p>

    <section id="controls">




      <label class="row">
        <span class="label">Keyword filter<span class="hint" id="kw-hint"></span></span>
        <input type="checkbox" class="switch" data-path="keywords.enabled" />
      </label>
      <label class="row">
        <span class="label">AI filter<span class="hint" id="ai-hint"></span></span>
        <input type="checkbox" class="switch" data-path="aiFilter.enabled" />
      </label>
    </section>

    <footer>
      <button class="btn" id="open-options">All settings</button>
    </footer>

    <script src="../shared/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
